<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕的海边骑行</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f9f3e5;color:#173c42;font:15px system-ui,sans-serif}
main{max-width:1100px;margin:auto;padding:clamp(16px,4vw,52px)}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{margin:0;font-size:clamp(24px,4vw,42px);letter-spacing:.05em}
button{font:inherit;color:inherit;background:#fffaf0;border:1px solid #9cafa7;border-radius:50px;padding:9px 18px;cursor:pointer}
button:focus-visible{outline:3px solid #dd7951;outline-offset:3px}
canvas{display:block;width:100%;height:auto;border-radius:24px;box-shadow:0 16px 36px #624a2526;background:#bde2dc}
</style>
<main>
<header><h1>鹈鹕的海边骑行</h1><button id="play">暂停</button></header>
<canvas id="scene" width="1000" height="580" role="img" aria-label="一只长着橙黄色大嘴的白鹈鹕，沿海边骑着红色自行车。"></canvas>
</main>
<script>
const canvas = document.querySelector('#scene');
const ctx = canvas.getContext('2d');
const button = document.querySelector('#play');
const tau = Math.PI * 2;
const ink = '#213b43';
const cream = '#fff8de';
const coral = '#ce5745';
const scale = Math.min(devicePixelRatio || 1, 2);
canvas.width = 1000 * scale;
canvas.height = 580 * scale;
ctx.scale(scale, scale);
ctx.lineCap = ctx.lineJoin = 'round';

function oval(x, y, rx, ry, color, tilt = 0) {
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, tilt, 0, tau);
  ctx.fillStyle = color;
  ctx.fill();
}
function line(color, width, ...points) {
  ctx.beginPath();
  ctx.moveTo(...points[0]);
  for (const point of points.slice(1)) ctx.lineTo(...point);
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.stroke();
}
function shape(data, color) {
  ctx.fillStyle = color;
  ctx.fill(new Path2D(data));
}
function gradient(y1, y2, top, bottom) {
  const g = ctx.createLinearGradient(0, y1, 0, y2);
  g.addColorStop(0, top);
  g.addColorStop(1, bottom);
  return g;
}
const sky = gradient(0, 290, '#98d3d2', '#f8e7bb');
const water = gradient(234, 448, '#458e9b', '#94cabe');
const sand = gradient(361, 490, '#f9deb0', '#d9a573');
function cloud(x, y, size) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(size, size);
  oval(0, 0, 66, 12, '#fff7ddba');
  oval(-26, -9, 24, 16, '#fff7ddba');
  oval(8, -16, 29, 21, '#fff7ddba');
  ctx.restore();
}
function coast(t) {
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, 1000, 580);
  oval(755, 147, 63, 63, '#ffe29f');
  cloud(150 - t * 5 % 1150, 104, 1.15);
  cloud(530 - t * 7 % 1150, 140, .68);
  cloud(1300 - t * 5 % 1150, 104, 1.15);
  cloud(1680 - t * 7 % 1150, 140, .68);
  shape('M0 248V216Q56 185 105 204T215 211Q252 210 294 240Z', '#709798');
  ctx.fillStyle = water;
  ctx.fillRect(0, 239, 1000, 229);
  for (let i = 0; i < 34; i++) {
    const y = 248 + i * 5.1;
    const x = ((i * 263 + Math.sin(t * 1.1 + i) * 23 + 1100) % 1100) - 55;
    const width = 15 + i % 5 * 12;
    line(i % 3 ? '#e5f5d78c' : '#fff1c1b5', 1 + i % 3, [x, y], [x + width, y]);
  }
  for (let i = 0; i < 2; i++) {
    ctx.beginPath();
    for (let x = 0; x <= 1000; x += 8) {
      const y = 350 + i * 32 + 12 * Math.sin(x / 145 + t * .8 + i) - x * .036;
      if (x === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    if (i === 1) {
      ctx.lineTo(1000, 580);
      ctx.lineTo(0, 580);
      ctx.closePath();
      ctx.fillStyle = sand;
      ctx.fill();
    }
    ctx.strokeStyle = i ? '#fff6d9' : '#daefdcaa';
    ctx.lineWidth = i ? 5 : 2;
    ctx.stroke();
  }
  for (let i = 0; i < 3; i++) {
    const x = (900 - (t * (22 + i * 4) + i * 52) % 1130 + 1130) % 1130 - 30;
    const y = 109 + i * 15 + Math.sin(t + i) * 6;
    const flap = 6 + Math.sin(t * 5 + i) * 4;
    ctx.beginPath();
    ctx.moveTo(x - 12, y - flap);
    ctx.quadraticCurveTo(x - 5, y - flap - 2, x, y);
    ctx.quadraticCurveTo(x + 5, y - flap - 2, x + 12, y - flap);
    ctx.strokeStyle = '#41666d';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  ctx.fillStyle = '#af7857';
  ctx.fillRect(0, 465, 1000, 81);
  ctx.fillStyle = '#bf8968';
  ctx.fillRect(0, 470, 1000, 65);
  ctx.fillStyle = '#e3ad7b';
  ctx.fillRect(0, 540, 1000, 40);
  for (let i = 0; i < 32; i++) {
    const x = ((i * 139 - t * 155) % 1060 + 1060) % 1060 - 25;
    const y = 479 + (i * 29 % 48);
    line('#e7aa8170', 1.4, [x, y], [x + 6 + i % 7, y]);
  }
  for (let i = 0; i < 12; i++) {
    const x = ((i * 127 - t * 155) % 1080 + 1080) % 1080 - 35;
    const y = 556 + i % 3 * 9;
    for (let j = -1; j <= 1; j++) {
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.quadraticCurveTo(x + j * 6, y - 12, x + j * 13, y - 12 - (i + j + 1) % 5);
      ctx.strokeStyle = i % 2 ? '#6c7956' : '#8b875d';
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }
  }
}
function wheel(x, y, angle) {
  oval(x, y, 46, 46, ink);
  oval(x, y, 39, 39, '#f0c198');
  oval(x, y, 36, 36, '#bd8969');
  for (let i = 0; i < 12; i++) {
    const a = angle + i * tau / 12;
    line('#f9e4bb', 1.3, [x, y], [x + 37 * Math.cos(a), y + 37 * Math.sin(a)]);
  }
  oval(x, y, 5, 5, ink);
}
function rider(t) {
  const angle = t * 155 / 46;
  const crank = t * 6;
  const bob = Math.sin(crank * 2) * 2;
  ctx.save();
  ctx.translate(487 + Math.sin(t * .68) * 74, 405);
  oval(0, 102, 166, 13, '#674a3a55');
  wheel(-93, 54, angle);
  wheel(99, 54, angle);

  const pedal = phase => [18 * Math.cos(phase), 48 + 18 * Math.sin(phase)];
  const far = pedal(crank + Math.PI);
  const near = pedal(crank);
  line('#a15e3d', 8, [-25, -21 + bob], [far[0] + 18, 16], far);
  line('#543c36', 8, [far[0] - 8, far[1]], [far[0] + 9, far[1]]);
  line(coral, 8, [-93, 54], [-34, -17], [0, 48], [-93, 54]);
  line(coral, 8, [-34, -17], [69, -23], [0, 48]);
  line(coral, 8, [99, 54], [69, -23], [59, -52], [80, -61]);
  line(ink, 8, [71, -61], [88, -61]);
  line(ink, 9, [-54, -22], [-21, -22]);
  oval(0, 48, 12, 12, ink);
  oval(0, 48, 7, 7, '#eecaa2');
  line(ink, 5, [0, 48], near);
  line(ink, 7, [near[0] - 7, near[1]], [near[0] + 10, near[1]]);
  line('#d38347', 9, [-25, -25 + bob], [near[0] + 19, 13 + bob], near);
  oval(near[0] + 5, near[1] - 4, 13, 5, '#eea35e', -.13);
  ctx.translate(0, bob);

  shape('M-61 -62Q-86 -64 -107 -88Q-78 -85 -49 -96Z', '#f9edcf');
  shape('M-86 -73C-65 -98 -28 -102 2 -89C15 -94 19 -110 16 -128C10 -158 24 -184 47 -185C73 -186 84 -165 75 -145C62 -132 52 -122 52 -103C55 -67 29 -36 -9 -30C-48 -26 -79 -44 -86 -73Z', cream);
  shape('M-84 -72C-58 -58 -21 -49 12 -60C5 -42 -5 -33 -24 -32C-50 -33 -74 -46 -84 -72Z', '#e7d7ba');
  shape('M64 -160C94 -155 123 -141 168 -125C135 -114 100 -108 72 -120C60 -126 57 -140 64 -160Z', '#eea953');
  shape('M65 -159C92 -160 137 -136 169 -125Q166 -119 159 -121L66 -146Q59 -151 65 -159Z', '#f6c46b');
  line('#c77f48', 2, [71, -146], [115, -134], [161, -123]);
  oval(56, -159, 8, 8, '#fffdf0');
  oval(58, -159, 4, 4, ink);
  oval(59, -160.5, 1.3, 1.3, '#fff');
  shape('M-53 -78C-26 -95 4 -82 27 -72C44 -66 62 -61 79 -64Q87 -59 80 -55C50 -48 23 -47 -1 -50C-26 -50 -46 -54 -53 -78Z', '#e6d5b7');
  shape('M-53 -78C-34 -92 -10 -85 16 -76C42 -67 61 -63 75 -63C58 -55 18 -54 -4 -57Q-44 -59 -53 -78Z', '#fff2d5');
  oval(79, -60, 8, 4, '#eee0c5');
  ctx.restore();
}
let time = 0;
let previous = null;
let playing = !matchMedia('(prefers-reduced-motion: reduce)').matches;
let request = null;
function paint() {
  coast(time);
  rider(time);
}
function frame(now) {
  if (previous !== null) time += Math.min((now - previous) / 1000, .05);
  previous = now;
  paint();
  request = requestAnimationFrame(frame);
}
function sync() {
  button.textContent = playing ? '暂停' : '播放';
  previous = null;
  if (playing) request = requestAnimationFrame(frame);
  else if (request !== null) cancelAnimationFrame(request);
}
button.addEventListener('click', () => {
  playing = !playing;
  sync();
});
paint();
sync();
</script>
</html>
